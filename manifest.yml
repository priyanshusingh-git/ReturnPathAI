---
# SAP BTP Cloud Foundry — ReturnPath AI deployment manifest
#
# BEFORE `cf push`:
#   1. Create the HANA Cloud service instance (first time only):
#        cf create-service hana-cloud hana hana-returnpath
#      Or use an existing instance — update the name under `services:` below.
#
#   2. Set secrets via cf set-env (never put secrets in this file):
#        cf set-env returnpath-ai CLERK_PUBLISHABLE_KEY  "pk_live_..."
#        cf set-env returnpath-ai CLERK_SECRET_KEY       "sk_live_..."
#        cf set-env returnpath-ai GROQ_API_KEY           "gsk_..."
#        cf set-env returnpath-ai ALLOWED_ORIGINS        "https://returnpath-ai.cfapps.ap21.hana.ondemand.com"
#
#   3. Push:
#        cf push
#
# HANA credentials are injected automatically via VCAP_SERVICES when the
# service is bound — no manual HANA_* env vars needed on BTP.

applications:
  - name: returnpath-ai
    memory: 512M
    disk_quota: 1024M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    command: node artifacts/api-server/dist/index.mjs
    # Configure runtime and secret environment variables with `cf set-env`.
    # Do not add a partial `env` block here: Cloud Foundry removes unlisted
    # variables during manifest application, including database credentials.
    services:
      - RETURNPATH_HANA   # existing HANA Cloud service instance (hana-free plan)
