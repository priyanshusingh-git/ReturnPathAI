kind = "web"
previewPath = "/"
title = "ReturnPath AI"
description = "A frontend-only skills-first recruitment experience for candidates and employers, with explainable matching, learning pathways, recruiter fairness monitoring, and human-in-the-loop review workflows."
version = "1.0.0"
id = "artifacts/returnpath-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19838

[services.development]
run = "pnpm --filter @workspace/returnpath-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/returnpath-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/returnpath-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19838"
BASE_PATH = "/"
